[project]
name = "my-finance-lambdas"
version = "0.1.0"
description = "Receipt pipeline Lambda functions: image conversion and parsing (ADR-013)"
requires-python = ">=3.11"
# Test environment only: each function ships its own requirements.txt in its container image.
dependencies = [
  "anthropic==2.6.0",
  "boto3==1.43.126",
  "pillow==12.1.1",
  "pillow-heif==0.18.0",
]

[project.optional-dependencies]
dev = [
  "moto[s3,dynamodb]==5.2.5",
  "pytest==8.3.3",
  "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Each function is a top-level package inside its own folder (as in its container image).
pythonpath = ["convert_image", "parse_receipt"]
testpaths = ["convert_image/tests", "parse_receipt/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
